<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 35px; animation: slideDown .6s ease-out; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,.3); }
        header p { font-size: 1.1em; opacity: .9; }
        .view-toggle { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .toggle-btn {
            padding: 12px 30px; border: 2px solid white; background: transparent; color: white;
            cursor: pointer; border-radius: 25px; font-size: 1em; font-weight: 600; transition: .3s;
        }
        .toggle-btn.active { background: white; color: #667eea; }
        .toggle-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,.2); }
        .category-section { margin-bottom: 34px; animation: fadeIn .5s ease-out; }
        .category-heading { color: white; font-size: 1.55em; margin: 0 0 15px; padding-bottom: 9px; border-bottom: 2px solid rgba(255,255,255,.55); }
        .category-count { font-size: .65em; font-weight: 500; opacity: .85; margin-left: 8px; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .project-card {
            background: white; border-radius: 15px; padding: 20px; cursor: pointer; transition: .3s;
            box-shadow: 0 5px 15px rgba(0,0,0,.1); border-left: 5px solid #667eea;
        }
        .project-card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0,0,0,.2); }
        .serial-no { display: inline-flex; background: #667eea; color: white; width: 35px; height: 35px; border-radius: 50%; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 10px; }
        .project-card h3 { color: #333; margin-bottom: 12px; font-size: 1.2em; }
        .category-tag { display: inline-block; background: #f0f2ff; color: #5967c7; border-radius: 14px; padding: 4px 10px; font-size: .8em; margin: 0 0 12px; }
        .project-info { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .info-item, .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; gap: 12px; }
        .info-label, .detail-label { font-weight: 600; color: #666; font-size: .9em; }
        .info-value, .detail-value { color: #333; font-weight: 500; text-align: right; }
        .profit-margin { background: #f0f9ff; padding: 10px; border-radius: 8px; text-align: center; }
        .profit-margin .label { font-size: .9em; color: #666; }
        .profit-margin .value { font-size: 1.25em; color: #28a745; font-weight: bold; }
        .view-details-btn { width: 100%; padding: 10px; background: #667eea; color: white; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 14px; }
        .view-details-btn:hover { background: #764ba2; }
        .empty-category { background: rgba(255,255,255,.13); color: white; padding: 16px; border-radius: 10px; }
        .projects-table-container { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 5px 15px rgba(0,0,0,.1); }
        .projects-table { width: 100%; border-collapse: collapse; min-width: 680px; }
        .projects-table thead { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .projects-table th { padding: 16px; text-align: left; font-size: .95em; }
        .projects-table td { padding: 13px 16px; border-bottom: 1px solid #eee; }
        .projects-table tbody tr.project-row { cursor: pointer; }
        .projects-table tbody tr.project-row:hover { background: #f8f9ff; }
        .projects-table .serial { font-weight: bold; color: #667eea; }
        .projects-table .profit { color: #28a745; font-weight: 600; }
        .table-category { background: #f0f2ff; color: #505fb9; font-weight: 700; }
        .table-category td { padding: 12px 16px; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,.55); padding: 20px; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 15px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); animation: slideUp .3s ease-out; }
        .modal-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 22px 25px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .modal-header h2 { font-size: 1.5em; }
        .close-btn { background: none; border: 0; color: white; font-size: 28px; cursor: pointer; }
        .modal-body { padding: 25px; }
        .detail-section { margin-bottom: 24px; }
        .detail-section h3 { color: #667eea; font-size: 1.15em; margin-bottom: 12px; border-bottom: 2px solid #667eea; padding-bottom: 9px; }
        .cost-benefit-chart { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
        .benefit-box { padding: 17px 10px; border-radius: 10px; text-align: center; border: 2px solid #667eea; background: #f5f7fa; }
        .benefit-box.year1 { background: #ffecd2; border-color: #ff6b6b; }
        .benefit-box.year2 { background: #fff9e6; border-color: #ffc93d; }
        .benefit-box.year3 { background: #d4fc79; border-color: #28a745; }
        .year-label { font-size: .9em; color: #666; margin-bottom: 5px; font-weight: 600; }
        .amount { font-size: 1.25em; color: #333; font-weight: bold; }
        .breakeven-info { background: #f0f9ff; border-left: 4px solid #667eea; padding: 14px; border-radius: 5px; margin-top: 18px; color: #333; line-height: 1.6; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 600px) {
            body { padding: 15px; }
            header h1 { font-size: 2em; }
            .projects-grid { grid-template-columns: 1fr; }
            .view-toggle { flex-direction: column; }
            .toggle-btn { width: 100%; }
            .cost-benefit-chart { grid-template-columns: 1fr; }
            .detail-row { align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>📊 Project Portfolio Dashboard</h1>
            <p>Investment &amp; Profit Analysis Overview</p>
        </header>

        <div class="view-toggle" aria-label="Choose project view">
            <button class="toggle-btn active" type="button" onclick="switchView('grid')" aria-pressed="true">Grid View</button>
            <button class="toggle-btn" type="button" onclick="switchView('table')" aria-pressed="false">Table View</button>
        </div>

        <div id="gridView"></div>
        <div id="tableView" style="display: none;"></div>
    </main>

    <div id="projectModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-btn" type="button" onclick="closeModal()" aria-label="Close project details">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-section">
                    <h3>Project Information</h3>
                    <div class="detail-row"><span class="detail-label">Category:</span><span class="detail-value" id="detailCategory"></span></div>
                    <div class="detail-row"><span class="detail-label">Initial Investment:</span><span class="detail-value" id="detailInvestment"></span></div>
                    <div class="detail-row"><span class="detail-label">Mature Monthly Revenue:</span><span class="detail-value" id="detailRevenue"></span></div>
                    <div class="detail-row"><span class="detail-label">Monthly Operating Profit:</span><span class="detail-value" id="detailProfit"></span></div>
                    <div class="detail-row"><span class="detail-label">Profit Margin:</span><span class="detail-value" id="detailMargin"></span></div>
                </div>
                <div class="detail-section" id="analysisSection">
                    <h3>1–3 Year Cost Benefit Analysis</h3>
                    <div class="cost-benefit-chart">
                        <div class="benefit-box year1"><div class="year-label">Year 1</div><div class="amount" id="year1Profit"></div></div>
                        <div class="benefit-box year2"><div class="year-label">Year 2</div><div class="amount" id="year2Profit"></div></div>
                        <div class="benefit-box year3"><div class="year-label">Year 3</div><div class="amount" id="year3Profit"></div></div>
                    </div>
                    <div class="detail-row"><span class="detail-label">Cumulative Profit (3 Years):</span><span class="detail-value" id="cumulativeProfit"></span></div>
                    <div class="detail-row"><span class="detail-label">ROI (Return on Investment):</span><span class="detail-value" id="detailROI"></span></div>
                    <div class="breakeven-info" id="breakEvenText"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            'Education',
            'IT Development',
            'Ecommerce',
            'Logistics',
            'Food',
            'Health and Fitness',
            'Digital Marketing and Campaign'
        ];

        // Financial amounts are in lakhs (L). New projects are listed without
        // financial estimates until those figures are available.
        const projects = [
            { id: 1, name: 'Local Services Platform', category: 'IT Development', investment: 8.05, revenue: 2.50, profit: 1.20 },
            { id: 2, name: 'EzyBilling', category: 'IT Development', investment: 6.65, revenue: 3.50, profit: 2.40 },
            { id: 3, name: 'Gym Software', category: 'Health and Fitness', investment: 5.65, revenue: 2.00, profit: 1.20 },
            { id: 4, name: 'Ecommerce', category: 'Ecommerce', investment: 12, revenue: 2.90, profit: 0.50 },
            { id: 5, name: 'Cab Booking', category: 'Logistics', investment: 10, revenue: 4.50, profit: 2.50 },
            { id: 6, name: 'News & Media', category: 'Digital Marketing and Campaign', investment: 5.50, revenue: 2.25, profit: 0.75 },
            { id: 7, name: 'The Big Plate App', category: 'Food', investment: 9, revenue: 4.75, profit: 2.25 },
            { id: 8, name: 'Custom IT Development', category: 'IT Development', investment: 7.50, revenue: 5.00, profit: 1.40 },
            { id: 9, name: 'Hosting/Server', category: 'IT Development', investment: 4, revenue: 3.00, profit: 2.00 },
            { id: 10, name: 'App Development & Hosting', category: 'IT Development', investment: 7, revenue: 4.00, profit: 1.75 },
            { id: 11, name: 'Digital Marketing', category: 'Digital Marketing and Campaign', investment: 3, revenue: 5.00, profit: 1.20 },
            { id: 12, name: 'Political Campaign Platform', category: 'Digital Marketing and Campaign', investment: 5, revenue: 4.00, profit: 1.50 },
            { id: 13, name: 'Leader/Followers CRM', category: 'Digital Marketing and Campaign', investment: 5, revenue: 5.00, profit: 2.50 },
            { id: 14, name: 'Sarapanchaparthi.com', category: 'IT Development', investment: 3, revenue: 1.50, profit: 0.60 },
            { id: 15, name: 'Gramsanjog.in', category: 'IT Development', investment: 3, revenue: 1.25, profit: 0.50 },
            { id: 16, name: 'OTDC Grocery Supply', category: 'Ecommerce', investment: 13.50, revenue: 15.00, profit: 0.80 },
            { id: 17, name: 'The Big Plate Operations', category: 'Food', investment: 8, revenue: 7.00, profit: 2.00 },
            { id: 18, name: 'Water Purifier Factory', category: 'Health and Fitness', investment: 27, revenue: 36.00, profit: 4.00 },
            { id: 19, name: 'Starkwizz', category: 'IT Development', investment: 12.25, revenue: 19.95, profit: 17.45 },
            { id: 20, name: 'Mushroom Farming', category: 'Food', investment: 13, revenue: 3.60, profit: 1.60 },
            { id: 21, name: 'Cab Transport Operations', category: 'Logistics', investment: 10, revenue: 4.50, profit: 2.50 },
            { id: 22, name: 'Livzo – Society Management Application', category: 'IT Development', investment: null, revenue: null, profit: null },
            { id: 23, name: 'Dairy Farm Management', category: 'Food', investment: null, revenue: null, profit: null }
        ];

        const formatAmount = value => value == null ? 'Not provided' : `₹${Number(value).toFixed(2)} L`;
        const getMargin = project => project.revenue > 0 && project.profit != null
            ? `${((project.profit / project.revenue) * 100).toFixed(1)}%` : 'Not provided';

        function renderGridView() {
            const gridView = document.getElementById('gridView');
            gridView.replaceChildren();
            categories.forEach(category => {
                const categoryProjects = projects.filter(project => project.category === category);
                const section = document.createElement('section');
                section.className = 'category-section';
                const heading = document.createElement('h2');
                heading.className = 'category-heading';
                heading.textContent = category;
                const count = document.createElement('span');
                count.className = 'category-count';
                count.textContent = `${categoryProjects.length} ${categoryProjects.length === 1 ? 'project' : 'projects'}`;
                heading.appendChild(count);
                section.appendChild(heading);
                if (!categoryProjects.length) {
                    const empty = document.createElement('p');
                    empty.className = 'empty-category';
                    empty.textContent = 'No projects listed in this category yet.';
                    section.appendChild(empty);
                } else {
                    const grid = document.createElement('div');
                    grid.className = 'projects-grid';
                    categoryProjects.forEach(project => {
                        const card = document.createElement('article');
                        card.className = 'project-card';
                        card.tabIndex = 0;
                        card.setAttribute('role', 'button');
                        card.setAttribute('aria-label', `View details for ${project.name}`);
                        card.addEventListener('click', () => openModal(project));
                        card.addEventListener('keydown', event => {
                            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openModal(project); }
                        });
                        const serial = document.createElement('div');
                        serial.className = 'serial-no';
                        serial.textContent = project.id;
                        const title = document.createElement('h3');
                        title.textContent = project.name;
                        const tag = document.createElement('span');
                        tag.className = 'category-tag';
                        tag.textContent = category;
                        const info = document.createElement('div');
                        info.className = 'project-info';
                        info.innerHTML = `
                            <div class="info-item"><span class="info-label">Initial Investment</span><span class="info-value">${formatAmount(project.investment)}</span></div>
                            <div class="info-item"><span class="info-label">Monthly Revenue</span><span class="info-value">${formatAmount(project.revenue)}</span></div>
                            <div class="info-item"><span class="info-label">Monthly Profit</span><span class="info-value">${formatAmount(project.profit)}</span></div>`;
                        const margin = document.createElement('div');
                        margin.className = 'profit-margin';
                        margin.innerHTML = `<div class="label">Profit Margin</div><div class="value">${getMargin(project)}</div>`;
                        const button = document.createElement('button');
                        button.className = 'view-details-btn';
                        button.type = 'button';
                        button.textContent = 'View Details';
                        button.addEventListener('click', event => { event.stopPropagation(); openModal(project); });
                        card.append(serial, title, tag, info, margin, button);
                        grid.appendChild(card);
                    });
                    section.appendChild(grid);
                }
                gridView.appendChild(section);
            });
        }

        function renderTableView() {
            const tableView = document.getElementById('tableView');
            tableView.replaceChildren();
            categories.forEach(category => {
                const categoryProjects = projects.filter(project => project.category === category);
                const section = document.createElement('section');
                section.className = 'category-section';
                const heading = document.createElement('h2');
                heading.className = 'category-heading';
                heading.textContent = `${category} (${categoryProjects.length})`;
                section.appendChild(heading);
                if (!categoryProjects.length) {
                    const empty = document.createElement('p');
                    empty.className = 'empty-category';
                    empty.textContent = 'No projects listed in this category yet.';
                    section.appendChild(empty);
                } else {
                    const container = document.createElement('div');
                    container.className = 'projects-table-container';
                    const table = document.createElement('table');
                    table.className = 'projects-table';
                    table.innerHTML = `<thead><tr><th>S.No</th><th>Project Name</th><th>Initial Investment</th><th>Monthly Revenue</th><th>Monthly Profit</th><th>Profit Margin</th></tr></thead>`;
                    const tbody = document.createElement('tbody');
                    categoryProjects.forEach(project => {
                        const row = document.createElement('tr');
                        row.className = 'project-row';
                        row.tabIndex = 0;
                        row.innerHTML = `<td class="serial">${project.id}</td><td>${project.name}</td><td>${formatAmount(project.investment)}</td><td>${formatAmount(project.revenue)}</td><td class="profit">${formatAmount(project.profit)}</td><td>${getMargin(project)}</td>`;
                        row.addEventListener('click', () => openModal(project));
                        row.addEventListener('keydown', event => { if (event.key === 'Enter') openModal(project); });
                        tbody.appendChild(row);
                    });
                    table.appendChild(tbody);
                    table.appendChild(document.createElement('tfoot'));
                    table.insertBefore(table.querySelector('thead'), table.firstChild);
                    table.appendChild(tbody);
                    container.appendChild(table);
                    section.appendChild(container);
                }
                tableView.appendChild(section);
            });
        }

        function switchView(view) {
            const gridView = document.getElementById('gridView');
            const tableView = document.getElementById('tableView');
            const buttons = document.querySelectorAll('.toggle-btn');
            const isGrid = view === 'grid';
            gridView.style.display = isGrid ? 'block' : 'none';
            tableView.style.display = isGrid ? 'none' : 'block';
            buttons[0].classList.toggle('active', isGrid);
            buttons[0].setAttribute('aria-pressed', String(isGrid));
            buttons[1].classList.toggle('active', !isGrid);
            buttons[1].setAttribute('aria-pressed', String(!isGrid));
        }

        function openModal(project) {
            document.getElementById('modalTitle').textContent = project.name;
            document.getElementById('detailCategory').textContent = project.category;
            document.getElementById('detailInvestment').textContent = formatAmount(project.investment);
            document.getElementById('detailRevenue').textContent = formatAmount(project.revenue);
            document.getElementById('detailProfit').textContent = formatAmount(project.profit);
            document.getElementById('detailMargin').textContent = getMargin(project);
            const analysis = document.getElementById('analysisSection');
            if (project.investment == null || project.profit == null) {
                analysis.style.display = 'none';
            } else {
                analysis.style.display = 'block';
                const annualProfit = project.profit * 12;
                const cumulativeProfit = annualProfit * 3 - project.investment;
                const roi = (cumulativeProfit / project.investment) * 100;
                document.getElementById('year1Profit').textContent = formatAmount(annualProfit);
                document.getElementById('year2Profit').textContent = formatAmount(annualProfit);
                document.getElementById('year3Profit').textContent = formatAmount(annualProfit);
                document.getElementById('cumulativeProfit').textContent = formatAmount(cumulativeProfit);
                document.getElementById('detailROI').textContent = `${roi.toFixed(1)}%`;
                const breakEvenMonths = project.profit > 0 ? Math.ceil(project.investment / project.profit) : null;
                document.getElementById('breakEvenText').innerHTML = breakEvenMonths
                    ? `<strong>Break-Even Analysis:</strong> Approximately <strong>${breakEvenMonths} months</strong> at the current monthly profit rate. Projections assume the monthly profit remains constant.`
                    : '<strong>Break-Even Analysis:</strong> Not available.';
            }
            document.getElementById('projectModal').classList.add('show');
            document.querySelector('.close-btn').focus();
        }

        function closeModal() {
            document.getElementById('projectModal').classList.remove('show');
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
        });

        function init() {
            renderGridView();
            renderTableView();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
